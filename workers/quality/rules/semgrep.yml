rules:
  - id: codaryn.dynamic-eval
    languages: [javascript, typescript]
    severity: WARNING
    message: Dynamic evaluation requires review
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)
  - id: codaryn.dynamic-shell
    languages: [javascript, typescript]
    severity: ERROR
    message: Shell execution requires review
    patterns:
      - pattern: $CP.exec($CMD, ...)
      - pattern-not: $CP.exec("...", ...)
  - id: codaryn.tls-disable
    languages: [javascript, typescript]
    severity: ERROR
    message: TLS verification disabled
    pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
