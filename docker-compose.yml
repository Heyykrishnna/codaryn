services:
  postgres:
    profiles: [local]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: codaryn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: codaryn
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codaryn -d codaryn"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  ingestion:
    profiles: [workers]
    build:
      context: .
      dockerfile: infrastructure/docker/ingestion.Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      REDIS_URL: redis://redis:6379
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=201326592,mode=1777
    mem_limit: 512m
    cpus: 1
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  schema:
    profiles: [workers]
    build:
      context: .
      dockerfile: infrastructure/docker/schema.Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
    read_only: true
    tmpfs:
      - /tmp:size=201326592,mode=1777
    mem_limit: 768m
    cpus: 1
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  execution:
    profiles: [workers]
    build:
      context: .
      dockerfile: infrastructure/docker/execution.Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
    read_only: true
    tmpfs:
      - /tmp:size=201326592,mode=1777
    mem_limit: 768m
    cpus: 1
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  quality:
    profiles: [workers]
    build:
      context: .
      dockerfile: infrastructure/docker/quality.Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      ALLOW_OSV_NETWORK: ${ALLOW_OSV_NETWORK:-false}
      SEMGREP_BINARY: ${SEMGREP_BINARY:-}
      OSV_SCANNER_BINARY: ${OSV_SCANNER_BINARY:-}
    stop_grace_period: 60s
    read_only: true
    tmpfs:
      - /tmp:size=201326592,mode=1777
    mem_limit: 768m
    cpus: 1
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  comparison:
    profiles: [workers]
    build:
      context: .
      dockerfile: infrastructure/docker/comparison.Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
    read_only: true
    tmpfs:
      - /tmp:size=201326592,mode=1777
    mem_limit: 768m
    cpus: 1
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 60s

  export:
    profiles: [workers]
    build:
      context: .
      dockerfile: infrastructure/docker/export.Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
    read_only: true
    tmpfs:
      - /tmp:size=201326592,mode=1777
    mem_limit: 768m
    cpus: 1
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 60s

  analysis:
    profiles: [workers]
    build:
      context: .
      dockerfile: infrastructure/docker/analysis.Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
    read_only: true
    tmpfs:
      - /tmp:size=201326592,mode=1777
    mem_limit: 768m
    cpus: 1
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 60s

volumes:
  postgres_data:
