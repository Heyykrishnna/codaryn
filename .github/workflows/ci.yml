name: CI
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: codaryn
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: codaryn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codaryn -d codaryn"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://codaryn:test-password@127.0.0.1:5432/codaryn
      DIRECT_DATABASE_URL: postgres://codaryn:test-password@127.0.0.1:5432/codaryn
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=moderate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm db:sync
      - run: pnpm test:integration
      - name: Verify migration idempotency
        run: pnpm db:migrate && pnpm db:verify
      - name: Build schema worker image
        run: docker build -f infrastructure/docker/schema.Dockerfile -t codaryn-schema-worker:ci .
      - name: Build execution worker image
        run: docker build -f infrastructure/docker/execution.Dockerfile -t codaryn-execution-worker:ci .
      - name: Build quality worker image
        run: docker build -f infrastructure/docker/quality.Dockerfile -t codaryn-quality-worker:ci .
      - name: Verify quality fixtures in isolated Node 22 image
        run: >-
          docker run --rm --network none --read-only
          --tmpfs /tmp:size=201326592,mode=1777
          --cap-drop ALL --security-opt no-new-privileges:true
          --mount "type=bind,source=$PWD/packages/engineering-analyzer/dist/engineering.test.js,target=/app/node_modules/.pnpm/@codaryn+engineering-analyzer@file+packages+engineering-analyzer/node_modules/@codaryn/engineering-analyzer/dist/engineering.test.js,readonly"
          --mount "type=bind,source=$PWD/workers/quality/dist/scanners.test.js,target=/app/dist/scanners.test.js,readonly"
          --entrypoint node codaryn-quality-worker:ci --test
          /app/node_modules/.pnpm/@codaryn+engineering-analyzer@file+packages+engineering-analyzer/node_modules/@codaryn/engineering-analyzer/dist/engineering.test.js
          /app/dist/scanners.test.js
      - name: Build comparison worker image
        run: docker build -f infrastructure/docker/comparison.Dockerfile -t codaryn-comparison-worker:ci .
      - name: Verify incremental comparison in isolated Node 22 image
        run: >-
          docker run --rm --network none --read-only
          --tmpfs /tmp:size=201326592,mode=1777 --cap-drop ALL
          --security-opt no-new-privileges:true
          --mount "type=bind,source=$PWD/packages/version-engine/dist/incremental.test.js,target=/app/node_modules/.pnpm/@codaryn+version-engine@file+packages+version-engine/node_modules/@codaryn/version-engine/dist/incremental.test.js,readonly"
          --mount "type=bind,source=$PWD/packages/version-engine/dist/comparison.test.js,target=/app/node_modules/.pnpm/@codaryn+version-engine@file+packages+version-engine/node_modules/@codaryn/version-engine/dist/comparison.test.js,readonly"
          --entrypoint node codaryn-comparison-worker:ci --test
          /app/node_modules/.pnpm/@codaryn+version-engine@file+packages+version-engine/node_modules/@codaryn/version-engine/dist/incremental.test.js
          /app/node_modules/.pnpm/@codaryn+version-engine@file+packages+version-engine/node_modules/@codaryn/version-engine/dist/comparison.test.js
      - name: Build export worker image
        run: docker build -f infrastructure/docker/export.Dockerfile -t codaryn-export-worker:ci .
      - name: Verify export fencing in isolated Node 22 image
        run: >-
          docker run --rm --network none --read-only
          --tmpfs /tmp:size=201326592,mode=1777 --cap-drop ALL
          --security-opt no-new-privileges:true
          --mount "type=bind,source=$PWD/workers/export/dist/process.test.js,target=/app/dist/process.test.js,readonly"
          --entrypoint node codaryn-export-worker:ci --test /app/dist/process.test.js
