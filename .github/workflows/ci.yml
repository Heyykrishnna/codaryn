name: CI
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: codaryn
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: codaryn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codaryn -d codaryn"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://codaryn:test-password@127.0.0.1:5432/codaryn
      DIRECT_DATABASE_URL: postgres://codaryn:test-password@127.0.0.1:5432/codaryn
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm db:sync
      - run: pnpm test:integration
      - name: Verify migration idempotency
        run: pnpm db:migrate && pnpm db:verify
      - name: Build schema worker image
        run: docker build -f infrastructure/docker/schema.Dockerfile -t codaryn-schema-worker:ci .
